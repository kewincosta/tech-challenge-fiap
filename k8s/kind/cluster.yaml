# The local cluster that scripts/local-cluster.sh creates. One node runs the control plane and the
# application. The chart's NodePort Service (30080) is published on localhost:18080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: workshop
nodes:
  - role: control-plane
    # Kubernetes 1.37, the version infra/environments/prod.tfvars pins for EKS. The digest is the
    # one the release notes of kind v0.33.0 list for this tag.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
        protocol: TCP
