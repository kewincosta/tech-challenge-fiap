{{- if .Values.mailpit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workshop.mailpit.fullname" . }}
  labels:
    {{- include "workshop.labels" (dict "context" . "component" "mailpit") | nindent 4 }}
spec:
  replicas: 1
  # The inbox lives in memory, so there is nothing to keep while a new pod replaces the old.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "workshop.selectorLabels" (dict "context" . "component" "mailpit") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workshop.labels" (dict "context" . "component" "mailpit") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: {{ printf "%s:%s" .Values.mailpit.image.repository (toString .Values.mailpit.image.tag) | quote }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Mailpit keeps its messages in a database file under /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workshop.mailpit.fullname" . }}
  labels:
    {{- include "workshop.labels" (dict "context" . "component" "mailpit") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "workshop.selectorLabels" (dict "context" . "component" "mailpit") | nindent 4 }}
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
{{- end }}
